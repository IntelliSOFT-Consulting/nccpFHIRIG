id: fhir.ke.nccp
canonical: https://fhir.dha.go.ke/nccp
name: KenyaNCCPIG
title: "Kenya National Cancer Control Programme (NCCP) FHIR Implementation Guide"
description: >-
  FHIR R4 Implementation Guide for the Kenya National Cancer Control Programme (NCCP),
  developed by the Digital Health Agency (DHA) under the Ministry of Health, Republic of Kenya.
  This guide defines standardized FHIR profiles, extensions, code systems and value sets to
  enable interoperable oncology data exchange across cancer treatment facilities, referral
  networks, and the Social Health Authority (SHA) claims system in Kenya.
status: draft
version: 0.1.0
